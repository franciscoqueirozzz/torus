[project]
name = "torus-meeting-intelligence"
version = "1.1.0"
description = "Análise de reuniões comerciais com classificação de intenção e acesso por perfil."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
